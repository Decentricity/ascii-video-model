[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurascii"
version = "0.1.0"
description = "Neural next-frame model operating natively on colored ASCII / libcaca video"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6",
  "torch>=2.1",
  "huggingface_hub>=0.23",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
neurascii-preprocess = "neurascii.preprocess:main"
neurascii-play = "neurascii.play:main"
neurascii-train = "neurascii.train:main"
neurascii-generate = "neurascii.generate:main"
neurascii-inspect = "neurascii.inspect_dataset:main"
neurascii-baselines = "neurascii.baselines:main"
neurascii-gif = "neurascii.render_gif:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
