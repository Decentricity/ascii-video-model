# Single-clip overfit sanity — ApplyEyeMakeup one long avm
data:
  processed_dir: data/processed/overfit_eye
  context_frames: 8
  patch_h: 4
  patch_w: 4
  future_frames: 1

model:
  d_model: 512
  n_heads: 8
  n_layers: 8
  d_ff: 2048
  dropout: 0.15

train:
  batch_size: 2
  lr: 2.0e-4
  weight_decay: 0.01
  max_steps: 3000
  min_steps: 500
  log_every: 50
  sample_every: 500
  checkpoint_every: 1000
  early_stop_patience: 6
  grad_clip: 1.0
  precision: bf16
  num_workers: 2
  seed: 42
  change_weight: 1.0
  use_delta: false
  scheduled_sampling_p_max: 0.0
  scheduled_sampling_warmup_steps: 500
  rollout_train_steps: 1
  rollout_train_steps_max: 1
  early_stop_on: val_loss

paths:
  run_dir: runs/overfit_eye
