# Smoke / overfit on minutes of data
data:
  processed_dir: data/processed/poc
  context_frames: 8
  patch_h: 4
  patch_w: 4

model:
  d_model: 256
  n_heads: 4
  n_layers: 4
  d_ff: 1024
  dropout: 0.1
  # ~ few million params

train:
  batch_size: 4
  lr: 3.0e-4
  weight_decay: 0.01
  max_steps: 2000
  log_every: 50
  sample_every: 200
  checkpoint_every: 500
  grad_clip: 1.0
  precision: bf16
  num_workers: 2
  seed: 42

paths:
  run_dir: runs/tiny
