# Scheduled sampling + change-weighted loss (motion focus)
data:
  processed_dir: data/processed/poc_eye
  context_frames: 8
  patch_h: 4
  patch_w: 4
  future_frames: 4

model:
  d_model: 512
  n_heads: 8
  n_layers: 8
  d_ff: 2048
  dropout: 0.15

train:
  batch_size: 2
  lr: 2.0e-4
  weight_decay: 0.01
  max_steps: 4000
  min_steps: 500
  log_every: 50
  sample_every: 500
  checkpoint_every: 1000
  early_stop_patience: 5
  grad_clip: 1.0
  precision: bf16
  num_workers: 2
  seed: 42
  change_weight: 5.0
  use_delta: false
  scheduled_sampling_p_max: 0.5
  scheduled_sampling_warmup_steps: 400
  rollout_train_steps: 2
  rollout_train_steps_max: 4
  early_stop_on: val_loss

paths:
  run_dir: runs/eye_motion
