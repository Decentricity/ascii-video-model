# Short retrain eye POC — early-stop validation of ckpt_best
data:
  processed_dir: data/processed/poc_eye
  context_frames: 8
  patch_h: 4
  patch_w: 4

model:
  d_model: 512
  n_heads: 8
  n_layers: 8
  d_ff: 2048
  dropout: 0.15

train:
  batch_size: 2
  lr: 2.0e-4
  weight_decay: 0.01
  max_steps: 2000
  min_steps: 500
  log_every: 50
  sample_every: 250
  checkpoint_every: 1000
  early_stop_patience: 3
  grad_clip: 1.0
  precision: bf16
  num_workers: 2
  seed: 42

paths:
  run_dir: runs/poc_eye_best
